name: repair Notion covers

on:
  workflow_dispatch:
    inputs:
      media_type:
        description: Database to repair
        required: true
        default: movie
        type: choice
        options:
          - movie
          - book
      status:
        description: Exact Notion status (optional)
        required: false
        default: ""
        type: string
      limit:
        description: Maximum covers to migrate in this run
        required: true
        default: "1"
        type: string
  push:
    branches:
      - agent/repair-priority-covers
    paths:
      - ".priority-cover-trigger"

permissions:
  contents: read

concurrency:
  group: repair-notion-covers-${{ github.event_name }}-${{ strategy.job-index }}
  cancel-in-progress: false

jobs:
  manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env: &notion-env
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      MOVIE_NOTION_TOKEN: ${{ secrets.MOVIE_NOTION_TOKEN }}
      BOOK_NOTION_TOKEN: ${{ secrets.BOOK_NOTION_TOKEN }}
      NOTION_MOVIE_URL: ${{ secrets.NOTION_MOVIE_URL }}
      NOTION_BOOK_URL: ${{ secrets.NOTION_BOOK_URL }}
    steps: &repair-steps
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install .
      - name: Validate Python
        run: python -m compileall -q douban2notion
      - name: Repair covers
        run: |
          STATUS_ARG=()
          if [ -n "${{ inputs.status }}" ]; then
            STATUS_ARG=(--status "${{ inputs.status }}")
          fi
          repair-covers "${{ inputs.media_type }}" --limit "${{ inputs.limit }}" "${STATUS_ARG[@]}"

  priority-in-progress:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - media_type: movie
            status: 在看
            limit: 52
          - media_type: book
            status: 在读
            limit: 13
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env: *notion-env
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install .
      - name: Validate Python
        run: python -m compileall -q douban2notion
      - name: Repair prioritized covers
        run: repair-covers "${{ matrix.media_type }}" --status "${{ matrix.status }}" --limit "${{ matrix.limit }}"
