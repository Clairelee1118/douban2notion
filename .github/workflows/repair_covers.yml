name: repair Notion covers

on:
  workflow_dispatch:
  push:
    branches:
      - agent/refresh-broken-wishlist-covers
    paths:
      - .refresh-wishlist-trigger

permissions:
  contents: read

concurrency:
  group: repair-wishlist-wikidata
  cancel-in-progress: false

jobs:
  refresh-wishlist:
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      MOVIE_NOTION_TOKEN: ${{ secrets.MOVIE_NOTION_TOKEN }}
      BOOK_NOTION_TOKEN: ${{ secrets.BOOK_NOTION_TOKEN }}
      NOTION_MOVIE_URL: ${{ secrets.NOTION_MOVIE_URL }}
      NOTION_BOOK_URL: ${{ secrets.NOTION_BOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install .
      - name: Validate Python
        run: python -m compileall -q douban2notion
      - name: Refresh IMDb-matched wishlist covers
        run: repair-covers movie --status "想看" --limit 500 --shard-count 4 --shard-index "${{ matrix.shard_index }}"
